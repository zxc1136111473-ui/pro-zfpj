name: build-deploy-package

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成部署包 (tarball)
        run: |
          set -eux
          PKG="zf-deploy-${GITHUB_REF_NAME#v}.tar.gz"
          # 打包一键部署 + 自建授权 + 文档(不含测试密钥/pro-ww.zip 附件)
          tar czf "$PKG" \
            zf-rev/deploy/deploy-zf-oneclick.sh \
            zf-rev/deploy/README-一键部署.md \
            zf-rev/mock-auth-server.py \
            zf-rev/REPORT-zeroforwarder-授权逆向.md \
            zf-rev/授权协议笔记.md \
            README.md
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          sha256sum "$PKG" > "$PKG.sha256"
          ls -lh "$PKG" "$PKG.sha256"

      - name: 附加 pro-ww.zip 离线安装包 (若 tag 含 offline 后缀)
        if: contains(github.ref_name, 'offline')
        run: |
          # pro-ww.zip 不在仓库内(37MB 附件), 由 maintainer 手动上传到对应 draft release
          echo "note: pro-ww.zip 由 release asset 手动提供; 触发 v*-offline tag 表示应附带"

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZeroForwarder 部署包 ${{ github.ref_name }}
          files: |
            zf-deploy-*.tar.gz
            zf-deploy-*.tar.gz.sha256
          fail_on_unmatched_files: true

      - name: 摘要
        run: |
          echo "### ✅ 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "附件: $PKG (含 sha256 校验)" >> "$GITHUB_STEP_SUMMARY"
          echo "真机用法: 解压后 sudo ./zf-rev/deploy/deploy-zf-oneclick.sh --web-domain <域> --controler-domain <域>" >> "$GITHUB_STEP_SUMMARY"
